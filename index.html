<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Portal Acadêmico Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Portal Acadêmico Digital</h1>
        <p>Ambiente de serviços acadêmicos</p>
    </header>

    <main>
        <section class="card">
            <h2>Consulta de Disciplinas</h2>
            <p id="mensagem">Clique no botao para consultar .</p>
            <button onclick="consultarDisciplinas()">Consultar disciplinas</button>
        </section>

        <section class="card">
            <h2>Simulador de Media</h2>
            <input type="number" id="nota1" placeholder="Nota 1">
            <input type="number" id="nota2" placeholder="Nota 2">
            <button onclick="mostrarMedia()">Calcular media</button>
            <p id="resultado"></p>
        </section>
    </main>
    <script src="funcoes.js"></script>
    <script src="script.js"></script>
</body>

</html>
